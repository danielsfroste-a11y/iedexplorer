name: Windows SCADA FAT build and local deploy

on:
  push:
    branches: [feature/scada-fat-view]
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.sln"
      - "scripts/build-deploy.cmd"
      - ".github/workflows/scada-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scada-fat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and install on Windows runner
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and deploy to runner folder
        shell: cmd
        run: call scripts\build-deploy.cmd
