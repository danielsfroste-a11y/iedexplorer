name: Build and install IEDExplorer FAT

on:
  push:
    branches: [feature/scada-fat-view, feature/scada-breaker-objects]
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.sln"
      - "scripts/**"
      - ".github/workflows/scada-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scada-fat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile with Visual Studio
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Microsoft MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Compile IEDExplorer (.NET Framework 4.8)
        shell: cmd
        run: msbuild IEDExplorer.sln /t:Rebuild /p:Configuration=Release "/p:Platform=Any CPU" /m:2 /v:minimal /nologo
      - name: Unit-test breaker binding and fail-closed behavior (no network)
        shell: cmd
        run: |
          start "" /wait "bin\\Release\\IEDExplorer.exe" --scada-selftest
          if errorlevel 1 exit /b 1
          if not exist scada-selftest-result.txt exit /b 1
          type scada-selftest-result.txt
          findstr /x /c:"PASS" scada-selftest-result.txt
          if errorlevel 1 exit /b 1
      - name: Check executable
        shell: cmd
        run: |
          if not exist "bin\Release\IEDExplorer.exe" exit /b 1
          dir "bin\Release"
      - name: Short-lived handoff to local runner
        uses: actions/upload-artifact@v4
        with:
          name: IEDExplorer-FAT-handoff
          path: bin/Release/
          if-no-files-found: error
          retention-days: 1

  install:
    name: Install compiled EXE on local machine
    needs: compile
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Receive compiled executable
        uses: actions/download-artifact@v4
        with:
          name: IEDExplorer-FAT-handoff
          path: local-package
      - name: Install durable local copy and startup launcher
        shell: cmd
        run: call scripts\deploy-local.cmd
      - name: Check REX615 TCP port 102 from this local runner (no MMS writes)
        shell: cmd
        continue-on-error: true
        run: |
          start "" /wait "local-package\\IEDExplorer.exe" --tcp102-probe=192.168.2.10
          if exist tcp102-probe-result.txt (
            type tcp102-probe-result.txt
          ) else (
            echo No TCP probe report was produced.
            exit /b 2
          )
      - name: Delete temporary handoff from Actions storage
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of data.artifacts) {
              if (artifact.name === 'IEDExplorer-FAT-handoff') {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                core.info(`Deleted temporary artifact ${artifact.id} after successful local installation`);
              }
            }
